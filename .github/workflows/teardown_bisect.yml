# Diagnostic, run by hand: which teardown pattern makes a window's render
# thread hang while the main thread joins it. Seen on GPU-less runner VMs:
# macOS (Apple's software GL; fixed in sextant b1edbb7) and Linux (llvmpipe
# under xvfb, Python 3.14). Each scenario of tools/teardown_bisect.py runs as
# its own job, against the wheel of an earlier `wheels` run, so the binary is
# the one that hung. Results: the run's summary page (one table row per
# scenario) and, for each hang, its Python and native stacks (macOS `sample`,
# Linux gdb) as an artifact.
#
#   gh workflow run teardown_bisect.yml -f wheels_run_id=<id> [-f platform=Linux] [-f python=3.14] [-f runs=40]
name: teardown bisect

on:
  workflow_dispatch:
    inputs:
      wheels_run_id:
        description: Run id of a `wheels` run whose wheels-<platform> artifact to test
        required: true
        type: string
      platform:
        description: Which wheel, on which runner
        type: choice
        options: [macOS, Linux]
        default: macOS
      python:
        description: Python version (the abi3 wheel is used)
        default: "3.12"
        type: string
      runs:
        description: Fresh-Python runs per scenario
        default: "40"
        type: string
      runner:
        description: Runner image; empty = macos-15 for macOS, ubuntu-24.04 for Linux
        default: ""
        type: string

permissions:
  contents: read
  actions: read   # the other run's artifact

jobs:
  bisect:
    name: ${{ matrix.scenario }}
    runs-on: ${{ inputs.runner || (inputs.platform == 'Linux' && 'ubuntu-24.04' || 'macos-15') }}
    timeout-minutes: 60
    env:
      GALLIUM_DRIVER: llvmpipe   # Linux: as the wheels workflow's display job
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - exit3
          - exit1
          - exit3_framed
          - exit3_staggered
          - close3
          - close_other_first
          - close_self_first
    steps:
      - uses: actions/checkout@v7   # tools/ only; the wheel is not rebuilt

      - uses: actions/download-artifact@v8
        with:
          name: wheels-${{ inputs.platform }}
          path: wheelhouse
          run-id: ${{ inputs.wheels_run_id }}
          github-token: ${{ github.token }}

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python }}

      - name: Install runtime dependencies (Linux)
        if: inputs.platform == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libgl1-mesa-dri libegl1 libegl-mesa0 xvfb xauth fonts-dejavu-core gdb

      - name: Install the wheel
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          if [ "${{ inputs.platform }}" = Linux ]; then
            wheel=$(ls wheelhouse/*-abi3-manylinux*.whl)
          else
            wheel=$(ls wheelhouse/*-cp312-abi3-macosx_*_arm64.whl)
          fi
          "$RUNNER_TEMP/venv/bin/python" -m pip install -q "$wheel"
          "$RUNNER_TEMP/venv/bin/python" -c "import sys, sextant; print(sys.version, sextant.__file__)"
          if [ "${{ inputs.platform }}" = Linux ]; then uname -a; else sw_vers; fi

      - name: Run ${{ matrix.scenario }}
        run: |
          {
            echo "| scenario | hangs | other failures | runs done | first hang | slowest |"
            echo "|---|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          cd "$RUNNER_TEMP"
          run=("$RUNNER_TEMP/venv/bin/python" "$GITHUB_WORKSPACE/tools/teardown_bisect.py"
               "${{ matrix.scenario }}" "${{ inputs.runs }}" --report-dir "$RUNNER_TEMP/reports")
          if [ "${{ inputs.platform }}" = Linux ]; then
            xvfb-run -a -s "-screen 0 1920x1080x24" "${run[@]}"
          else
            "${run[@]}"
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports-${{ matrix.scenario }}
          path: ${{ runner.temp }}/reports
          if-no-files-found: ignore
